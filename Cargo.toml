[package]
name = "moat"
version = "0.1.28"
edition = "2024"
rust-version = "1.88"
description = "supply-chain hygiene for your github organization & repositories"
license = "MIT"
repository = "https://github.com/nunomaduro/moat"
homepage = "https://github.com/nunomaduro/moat"
keywords = ["security", "supply-chain", "github", "audit", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "moat"
path = "src/lib.rs"

[[bin]]
name = "moat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
owo-colors = "4"
futures = "0.3"
serde_yaml = "0.9"
toml = "1.1"
terminal_size = "0.4"
terminal-light = "1"
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls", "archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate"] }

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
