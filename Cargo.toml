[package]
name = "moat"
version = "0.1.0"
edition = "2024"
description = "Supply-chain security auditor for GitHub organizations"
license = "MIT"
repository = "https://github.com/nunomaduro/moat"
homepage = "https://github.com/nunomaduro/moat"
keywords = ["security", "supply-chain", "github", "audit", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
owo-colors = "4"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
